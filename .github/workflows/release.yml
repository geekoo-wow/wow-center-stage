name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Packages according to .pkgmeta (package-as, ignore list, changelog),
      # substitutes TOC keywords like @project-version@ from the git tag,
      # and attaches the trimmed zip to a GitHub release for the tag.
      # CurseForge/WoWInterface/Wago uploads activate automatically if their
      # tokens (CF_API_KEY, WOWI_API_TOKEN, WAGO_API_TOKEN) are ever added
      # as repository secrets.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
